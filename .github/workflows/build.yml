name: Build check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare package
        run: npm run check:cloudflare

      - name: Check Yellowdawg catalog-sync credential
        id: catalog-sync-credential
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY is not configured; Yellowdawg catalog sync cannot run."
          fi

      - name: Sync MusicVerse catalog to Yellowdawg
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.catalog-sync-credential.outputs.available == 'true'
        env:
          MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MUSICVERSE_SUPABASE_SERVICE_ROLE_KEY }}
          MUSICVERSE_SUPABASE_EXPECTED_PROJECT_REF: wntakzfoprthwggkidyq
        run: npm run catalog:apply

      - name: Audit Yellowdawg catalog alignment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MUSICVERSE_SUPABASE_EXPECTED_PROJECT_REF: wntakzfoprthwggkidyq
        run: npm run catalog:audit
